  <path d="M1046 446 V470" class="edge"/>
  <path d="M1224 446 V470" class="edge"/>
  <path d="M1224 542 V566" class="edge"/>
  <path d="M1046 542 V566" class="edge optional"/>
  <path d="M1046 638 C1046 712, 914 712, 914 802" class="edge optional"/>
  <path d="M1224 638 V802" class="edge"/>
  <path d="M602 542 C602 712, 164 712, 164 802" class="edge optional"/>
  <path d="M602 542 C602 712, 350 712, 350 802" class="edge optional"/>
  <path d="M602 542 C602 712, 536 712, 536 802" class="edge optional"/>
